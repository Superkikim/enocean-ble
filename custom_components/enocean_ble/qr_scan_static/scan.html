function pickLanguage() {
  for (const lang of navigator.languages || [navigator.language || "en"]) {
    if (I18N[lang]) return lang;
    if (lang.toLowerCase().startsWith("pt")) return "pt-BR";
    const base = lang.split("-")[0];
    if (I18N[base]) return base;
  }
  return "en";
}

const looksLikeEnoceanQr = (text) => /30S[0-9A-Fa-f]{12}/.test(text) && /\+Z[0-9A-Fa-f]{32}/.test(text);

let detector = null;
let jsQrLoaded = false;
let done = false;
// Digital zoom factor: the video is enlarged and only its centre is decoded.
let digitalZoom = 1;

const loadScript = (src) => new Promise((resolve, reject) => {
  const script = document.createElement("script");
  script.src = src;
  script.onload = resolve;
  script.onerror = () => reject(new Error(src.split("/").pop()));
  document.head.appendChild(script);
});

async function setupDecoder() {
  // BarcodeDetector may exist without QR support (e.g. Android without Google Play services).
  try {
    if ("BarcodeDetector" in window && (await BarcodeDetector.getSupportedFormats()).includes("qr_code")) {
      detector = new BarcodeDetector({ formats: ["qr_code"] });
      return;
    }
  } catch (e) {
    // fall back on jsQR
  }
  detector = null;
  await ensureJsQr();
}

async function ensureJsQr() {
  if (!jsQrLoaded) {
    await loadScript(JSQR_URL);
    jsQrLoaded = true;
  }
}

// Draw the centre of the source (1/zoom of each side) on the canvas.
function drawCentre(source, width, height, zoom) {
  const sw = Math.round(width / zoom);
  const sh = Math.round(height / zoom);
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  canvas.width = sw;
  canvas.height = sh;
  ctx.drawImage(source, Math.round((width - sw) / 2), Math.round((height - sh) / 2), sw, sh, 0, 0, sw, sh);
  return ctx;
}

// Decode a video frame or an image with BarcodeDetector, else jsQR.
async function decode(source, width, height, zoom = 1) {
  if (detector) {
    try {
      const target = zoom > 1 ? (drawCentre(source, width, height, zoom), canvas) : source;
      return (await detector.detect(target))[0]?.rawValue;
    } catch (e) {
      detector = null; // native detector failed: switch to jsQR
    }
  }
  await ensureJsQr();
  const ctx = drawCentre(source, width, height, zoom);
  return jsQR(ctx.getImageData(0, 0, canvas.width, canvas.height).data, canvas.width, canvas.height)?.data;
}

// Light and zoom. The camera's own zoom and light are used when the browser offers
// them (Chrome on Android); otherwise the zoom is digital and there is no light.
function setupControls(track) {
  let caps = {};
  try {
    caps = (track.getCapabilities && track.getCapabilities()) || {};
  } catch (e) {
    caps = {};
  }
  if ((caps.focusMode || []).includes("continuous")) {
    track.applyConstraints({ advanced: [{ focusMode: "continuous" }] }).catch(() => {});
  }

  torchButton.hidden = !caps.torch;
  if (caps.torch) {
    let on = false;
    torchButton.setAttribute("aria-pressed", "false");
    torchButton.onclick = async () => {
      try {
        await track.applyConstraints({ advanced: [{ torch: !on }] });
        on = !on;
        torchButton.setAttribute("aria-pressed", String(on));
      } catch (e) {
        torchButton.hidden = true;
      }
    };
  }

  let cameraZoom = caps.zoom && caps.zoom.max > caps.zoom.min ? caps.zoom : null;
  const useDigitalZoom = () => {
    cameraZoom = null;
    zoomInput.min = 1;
    zoomInput.max = 4;
    zoomInput.step = 0.1;
    zoomInput.value = 1;
  };
  if (cameraZoom) {
    zoomInput.min = cameraZoom.min;
    zoomInput.max = cameraZoom.max;
    zoomInput.step = cameraZoom.step || 0.1;
    zoomInput.value = track.getSettings().zoom || cameraZoom.min;
  } else {
    useDigitalZoom();
  }
  digitalZoom = 1;
  video.style.transform = "";
  zoomInput.oninput = () => {
    const value = Number(zoomInput.value);
    if (cameraZoom) {
      track.applyConstraints({ advanced: [{ zoom: value }] }).catch(() => useDigitalZoom());
      return;
    }
    digitalZoom = value;
    video.style.transform = value > 1 ? `scale(${value})` : "";
  };
  zoomWrap.hidden = false;
  controls.hidden = false;
}

function stopCamera() {
  controls.hidden = true;
  digitalZoom = 1;
  video.style.transform = "";
  if (video.srcObject) {
    video.srcObject.getTracks().forEach((track) => track.stop());
    video.srcObject = null;
  }
  video.hidden = true;
}

// Send the QR code to Home Assistant, which checks it against the discovered switch.
async function send(text) {
  done = true;
  say(T.checking);
  let resp;
  try {
    resp = await fetch(location.pathname, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ qr: text }),
    });
  } catch (e) {
    done = false; // network hiccup: keep the camera on and scan again
    say(T.network, "err");
    return;
  }
  stopCamera();
  photoButton.hidden = true;
  if (resp.ok) {
    say(T.added, "ok");
    return;
  }
  if (resp.status === 404) {
    say(T.expired, "err");
    return;
  }
  let code = null;
  try { code = (await resp.json()).code; } catch (e) { /* no body */ }
  // The flow now shows the error in Home Assistant: the user starts again from there.
  say(`${T[code] || T.notEnocean} ${T.goBack}`, "err");
}

async function tick() {
  if (done) return;
  try {
    const text = video.readyState >= 2 ? await decode(video, video.videoWidth, video.videoHeight, digitalZoom) : null;
    if (text) {
      if (looksLikeEnoceanQr(text)) {
        await send(text);
        if (done) return;
      } else {
        say(T.notEnocean, "err");
      }
    }
  } catch (e) {
    say(T.read + e.message, "err");
  }
  setTimeout(tick, 250);
}

async function startCamera() {
  done = false;
  photoButton.hidden = false;
  if (!window.isSecureContext || !navigator.mediaDevices) {
    return say(T.https, "err");
  }
  video.hidden = false;
  try {
    await setupDecoder();
    // Ask for a high resolution: browsers often default to 640x480, too low for a small QR code.
    video.srcObject = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false,
    });
    await video.play();
    setupControls(video.srcObject.getVideoTracks()[0]);
    say(T.aim);
    tick();
  } catch (e) {
    video.hidden = true;
    say(T.camera + e.message, "err");
  }
}

async function scanPhoto(file) {
  try {
    const bitmap = await createImageBitmap(file);
    const text = await decode(bitmap, bitmap.width, bitmap.height);
    if (text && looksLikeEnoceanQr(text)) {
      await send(text);
    } else {
      say(T.noQrInPhoto, "err");
    }
  } catch (e) {
    say(T.read + e.message, "err");
  }
}

photoButton.onclick = () => fileInput.click();
fileInput.onchange = () => {
  const file = fileInput.files && fileInput.files[0];
  fileInput.value = "";
  if (file) {
    done = true;
    stopCamera();
    scanPhoto(file);
  }
};

// Touch screen + mobile browser (iPadOS reports itself as a Mac with touch points).
function isPhone() {
  const ua = navigator.userAgent;
  const mobile = navigator.userAgentData?.mobile || /Android|iPhone|iPad|iPod|Mobile/i.test(ua)
    || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  return mobile && matchMedia("(pointer: coarse)").matches;
}

// On a computer: show this page as a QR code for the phone, until the flow moves on.
async function showHandoff() {
  const handoff = document.getElementById("handoff");
  handoff.hidden = false;
  try {
    await loadScript(QRCODE_URL);
    const qr = qrcode(0, "M");
    qr.addData(location.href);
    qr.make();
    document.getElementById("qr").innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
  } catch (e) {
    handoff.hidden = true;
    return startCamera();
  }
  const poll = setInterval(async () => {
    try {
      if ((await fetch(location.pathname, { cache: "no-store" })).status !== 404) return;
    } catch (e) {
      return;
    }
    clearInterval(poll);
    handoff.hidden = true;
    say(T.stepDone, "ok");
  }, 3000);
  document.getElementById("use-here").onclick = () => {
    clearInterval(poll);
    handoff.hidden = true;
    startCamera();
  };
}

isPhone() ? startCamera() : showHandoff();
</script>
</body>
</html>
